<section class="placeholder-page">
  <p>Radiology</p>
  <h1>Radiology workspace</h1>
  <span>This is a placeholder page for radiology.</span>

  <div class="table-container">
    @if (radiology().length) {
      <app-table [columns]="columns" [rows]="radiology()" />
    } @else if (isLoading()) {
      <div class="empty-state">
        <p>Loading...</p>
      </div>
    } @else if (error()) {
      <div class="empty-state">
        <p>{{ error() }}</p>
      </div>
    } @else {
      <div class="empty-state">
        <p>No radiologies found.</p>
      </div>
    }
  </div>
</section>
