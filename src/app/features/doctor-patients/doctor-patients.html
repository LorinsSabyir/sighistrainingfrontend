<section class="placeholder-page">
  <p>My Patients</p>
  <h1>Assigned Patient Encounters</h1>
  <span>Encounters currently assigned to you.</span>

  <div class="flex items-center justify-between gap-4 mb-6 py-3 flex-wrap">
    <app-search-bar> </app-search-bar>
  </div>
  
  <div class="table-container">
    @if (encounters().length) {
      <app-table [columns]="columns" [rows]="encounters()">
        <ng-template appTableCell="patient_id" let-encounter>
          {{ encounter.patient?.pid ?? '—' }}
        </ng-template>
      </app-table>
    } @else if (isLoading()) {
      <div class="empty-state">
        <p>Loading...</p>
      </div>
    } @else if (error()) {
      <div class="empty-state">
        <p>{{ error() }}</p>
      </div>
    } @else {
      <div class="empty-state">
        <p>No assigned patients found.</p>
      </div>
    }
  </div>
</section>
