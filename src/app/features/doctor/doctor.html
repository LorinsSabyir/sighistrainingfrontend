<section class="placeholder-page">
  <p>Doctor</p>
  <h1>Doctor workspace</h1>
  <span>This is a placeholder page for doctor.</span>

  <div class="flex items-center justify-between gap-4 mb-6 py-3 flex-wrap">
    <app-search-bar> </app-search-bar>

    <app-button button_text="Create new Doctor" ></app-button>
  </div>

  <div class="table-container">
    @if (doctors().length) {
      <app-table [columns]="columns" [rows]="doctors()" />
    } @else if (isLoading()) {
      <div class="empty-state">
        <p>Loading...</p>
      </div>
    } @else if (error()) {
      <div class="empty-state">
        <p>{{ error() }}</p>
      </div>
    } @else {
      <div class="empty-state">
        <p>No doctors found.</p>
      </div>
    }
  </div>
  
</section>
