<section class="placeholder-page">
  <p>Nurse</p>
  <h1>Nurse workspace</h1>
  <span>This is a placeholder page for nurse.</span>

  <div class="flex items-center justify-between gap-4 mb-6 py-3 flex-wrap">
    <app-search-bar></app-search-bar>
  
    <app-button button_text="Create new Nurse"></app-button>
  </div>

  <div class="table-container">
    @if (nurses().length) {
      <app-table [columns]="columns" [rows]="nurses()" />
    } @else if (isLoading()) {
      <div class="empty-state">
        <p>Loading...</p>
      </div>
    } @else if (error()) {
      <div class="empty-state">
        <p>{{ error() }}</p>
      </div>
    } @else {
      <div class="empty-state">
        <p>No nurses found.</p>
      </div>
    }
  </div>
  
</section>
