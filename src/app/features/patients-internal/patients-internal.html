<section class="placeholder-page">
  <p>Patients</p>
  <h1>Patient records</h1>
  <span>This is a placeholder page for patient management.</span>

  <div class="flex items-center justify-between mb-6">
    <app-search-bar (searched)="onSearch($event)"> </app-search-bar>

    <app-button button_text="Create new Patient" (buttonClick)="openCreateModal()"></app-button>
  </div>

  <!-- Create & Edit Patient Details -->
  <app-modal-form
    [isOpen]="isModalOpen()"
    [title]="editingPatient() ? 'Edit Patient' : 'New Patient'"
    [fields]="patientFields"
    [initialValue]="editingPatient()"
    [submitLabel]="editingPatient() ? 'Update' : 'Create'"
    (closed)="isModalOpen.set(false)"
    (submitted)="onModalSubmit($event)"
  />

  <!-- Create Patient Encounter -->
  <app-modal-form
    [isOpen]="isEncounterOpen()"
    [title]="'Create Encounter'"
    [fields]="encounterFields"
    [initialValue]="null"
    [submitLabel]="'Create'"
    (closed)="isEncounterOpen.set(false)"
    (submitted)="onEncounterSubmit($event)"
    />

  <div class="table-container">
    @if (patients().length) {
      <app-table [columns]="columns" [rows]="patients()">
        <ng-template appTableCell="actions" let-patient>
          <div class="flex justify-end gap-2">
            <app-button
              icon="edit"
              variant="info"
              [iconOnly]="true"
              (buttonClick)="openEditModal(patient)"
            />
            <app-button
              icon="calendar_month"
              variant="success"
              [iconOnly]="true"
              (buttonClick)="openCreateEncounterModal(patient)"
            />
            <app-button
              icon="delete"
              variant="danger"
              [iconOnly]="true"
              (buttonClick)="onDeletePatient(patient)"
            />
          </div>
        </ng-template>
      </app-table>
    } @else if (isLoading()) {
      <div class="empty-state">
        <p>Loading...</p>
      </div>
    } @else if (error()) {
      <div class="empty-state">
        <p>{{ error() }}</p>
      </div>
    } @else {
      <div class="empty-state">
        <p>No patients found.</p>
      </div>
    }
  </div>
</section>
