<section class="placeholder-page">
  <p>Appointments</p>
  <h1>Patient Appointments</h1>
  <span>Manage patient encounters and appointments.</span>

  <div class="flex items-center justify-between mb-6">
    <app-search-bar (searched)="onSearch($event)"> </app-search-bar>
  </div>

  <app-modal-form
    [isOpen]="isModalOpen()"
    [title]="editingEncounter() ? 'Edit Appointment' : 'New Appointment'"
    [fields]="encounterFields"
    [initialValue]="editingEncounter()"
    [submitLabel]="editingEncounter() ? 'Update' : 'Create'"
    (closed)="isModalOpen.set(false)"
    (submitted)="onModalSubmit($event)"
  />

  <div class="table-container">
    @if (encounters().length) {
      <app-table [columns]="columns" [rows]="encounters()">
        <!-- Patiend PID -->
        <ng-template appTableCell="patient_id" let-encounter>
          <div class="id_badge">
            {{ encounter.patient?.pid ?? '—' }}
          </div>
        </ng-template>
        
        <!-- Ward ID -->
        <ng-template appTableCell="ward_id" let-encounter>
          <div class="id_badge">
            {{ encounter.ward?.ward_id ?? '—' }}
          </div>
        </ng-template>

        <!-- Actions -->
        <ng-template appTableCell="actions" let-encounter>
          <div class="flex justify-end gap-2">
            <app-button
              icon="edit"
              variant="info"
              [iconOnly]="true"
              (buttonClick)="openEditModal(encounter)"
            >
            </app-button>

            <app-button
              icon="delete"
              variant="danger"
              [iconOnly]="true"
              (buttonClick)="onDeleteEncounter(encounter)"
            >
            </app-button>
          </div>
        </ng-template>
      </app-table>
    } @else if (isLoading()) {
      <div class="empty-state">
        <p>Loading...</p>
      </div>
    } @else if (error()) {
      <div class="empty-state">
        <p>{{ error() }}</p>
      </div>
    } @else {
      <div class="empty-state">
        <p>No encounters found.</p>
      </div>
    }
  </div>
</section>
