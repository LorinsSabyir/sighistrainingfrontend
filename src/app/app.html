<main class="login-page">
  <section class="brand-panel" aria-label="Hospital information system">
    <div class="brand-mark" aria-hidden="true">
      <span></span>
    </div>
    <p class="eyebrow">Hospital Information System</p>
    <h1>Secure clinical access</h1>
    <p class="supporting-copy">
      A quiet sign-in experience for staff workflows, patient records, and hospital operations.
    </p>
  </section>

  <section class="login-panel" aria-label="Login form">
    <form class="login-card" [formGroup]="loginForm" (ngSubmit)="login()">
      <div>
        <p class="form-kicker">Staff portal</p>
        <h2>Sign in</h2>
      </div>

      <label class="field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="name@hospital.com"
          aria-describedby="login-message"
        />
      </label>

      <label class="field">
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          aria-describedby="login-message"
        />
      </label>

      @if (errorMessage()) {
        <p id="login-message" class="message error" role="alert">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
        <p id="login-message" class="message success" role="status">{{ successMessage() }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
