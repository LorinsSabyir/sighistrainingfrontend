<button
  type="button"
  class="notification-card w-full text-left rounded-md border-l-4 bg-white p-4 shadow-sm transition hover:shadow-md"
  [class]="accentClass"
  [class.notification-card--unread]="!notification.is_read"
  (click)="onClick()"
>
  <div class="flex items-start justify-between gap-3">
    <div class="flex-1">
      <div class="flex items-center gap-2">
        @if (!notification.is_read) {
          <span class="h-2 w-2 rounded-full bg-[var(--color-primary)]"></span>
        }
        <h3 class="text-sm font-semibold text-gray-800">{{ notification.title }}</h3>
      </div>

      @if (notification.message) {
        <p class="mt-1 text-sm text-gray-600">{{ notification.message }}</p>
      }

      <div class="mt-2 flex items-center gap-2 text-xs text-gray-400">
        <span>{{ senderName }}</span>
        @if (formattedTime) {
          <span>•</span>
          <span>{{ formattedTime }}</span>
        }
      </div>
    </div>

    @if (notification.category) {
      <span class="shrink-0 rounded-full bg-[var(--color-secondary-light)] px-2 py-0.5 text-xs font-medium text-[var(--color-secondary)]">
        {{ notification.category }}
      </span>
    }
  </div>
</button>
