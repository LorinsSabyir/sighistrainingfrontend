<button
  type="button"
  class="app-button flex items-center justify-center gap-2 rounded-md text-sm font-medium transition"
  [class]="buttonClasses"
  [class.app-button--icon-only]="iconOnly"
  [disabled]="disabled"
  (click)="buttonClicked()"
>
  @if (icon) {
    <mat-icon>{{ icon }}</mat-icon>
  }

  @if (!iconOnly && button_text) {
    <span>{{ button_text }}</span>
  }
</button>
