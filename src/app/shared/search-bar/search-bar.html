<div class="flex flex-wrap items-end gap-2">
  <input
    type="text"
    placeholder="Search..."
    [ngModel]="query()"
    (ngModelChange)="query.set($event)"
    (keyup.enter)="onSubmit()"
  />

  @if (query()) {
    <app-button icon="closed" (buttonClick)="clear()"> </app-button>
  }

  <app-button icon="search" (buttonClick)="onSubmit()"> </app-button>
</div>
