<aside
  class="sidebar fixed top-0 left-0 flex h-screen w-[280px] flex-col gap-6 overflow-hidden p-5"
  aria-label="Main navigation"
>
  <div class="brand flex items-center gap-3.5 border-b pb-5">
    <div class="brand-mark shrink-0" aria-hidden="true">
      <span></span>
    </div>

    <div>
      <p>SIGHIS</p>
      <strong>Hospital System</strong>
    </div>

    <div>
      <app-button routerLink="/notifications" icon="notifications"></app-button>
    </div>
    
  </div>

  <nav class="navigation flex-1 overflow-y-auto overflow-x-hidden pr-1">
    @for (item of navigationItems; track item.route) {
      <a
        class="flex min-h-[46px] items-center gap-3 my-1 rounded-lg border border-transparent px-3 py-2.5"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      >
        <span class="nav-icon grid h-7 w-7 place-items-center" aria-hidden="true">
          {{ item.icon }}
        </span>

        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="status-card mt-auto p-4">
    <p>Today</p>

    <strong>Clinical operations online</strong>

    <app-button
      button_text="Logout"
      (buttonClick)="logout()"
    ></app-button>
  </div>
</aside>
