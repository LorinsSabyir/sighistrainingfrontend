<!-- General Error Message -->
<div *ngIf="errors.general" 
     class="w-full mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-300 text-sm">
  {{ errors.general }}
</div>

<!-- Two-column layout for better organization -->
<div class="grid grid-cols-2 gap-4 mb-4">
  <div>
    <label class="text-sm text-gray-400 mb-2">Username</label>
    <input type="text" [ngModel]="formData.username" (ngModelChange)="onFieldChange('username', $event)"
      class="w-full mb-2 px-4 py-3 border rounded-xl 
             focus:ring-2 outline-none 
             bg-white text-gray-900 placeholder-gray-400"
      [ngClass]="{
        'border-gray-200': !errors.username,
        'border-red-500 ring-red-500': errors.username
      }"
      placeholder="Choose username" />
    <div *ngIf="errors.username" 
         class="text-red-400 text-xs">
      {{ errors.username }}
    </div>
  </div>

  <div>
    <label class="text-sm text-gray-400 mb-2">Department</label>
    <select [ngModel]="formData.department" (ngModelChange)="onFieldChange('department', $event)"
      class="w-full mb-2 px-4 py-3 border rounded-xl 
             focus:ring-2 outline-none 
             bg-white text-gray-900"
      [ngClass]="{
        'border-gray-200': !errors.department,
        'border-red-500 ring-red-500': errors.department
      }">
      <option value="">Select Department</option>
      <option *ngFor="let dept of departments" [value]="dept.value">{{ dept.label }}</option>
    </select>
    <div *ngIf="errors.department" 
         class="text-red-400 text-xs">
      {{ errors.department }}
    </div>
  </div>
</div>

    <input type="text" [ngModel]="formData.firstName" (ngModelChange)="onFieldChange('firstName', $event)"

</div>

<div class="grid grid-cols-2 gap-4 mb-4">
  <div>
    <label class="text-sm text-gray-400 mb-2">Email Address</label>
    <input type="email" [ngModel]="formData.email" (ngModelChange)="onFieldChange('email', $event)"
      class="w-full mb-2 px-4 py-3 border rounded-xl 
             focus:ring-2 outline-none 
             bg-white text-gray-900 placeholder-gray-400"
      [ngClass]="{
        'border-gray-200': !errors.email,
        'border-red-500 ring-red-500': errors.email
      }"
      placeholder="email@example.com" />
    <div *ngIf="errors.email" 
         class="text-red-400 text-xs">
      {{ errors.email }}
    </div>
  </div>

  <div>
    <label class="text-sm text-gray-400 mb-2">Phone Number</label>
    <input type="tel" [ngModel]="formData.phone" (ngModelChange)="onFieldChange('phone', $event)"
      class="w-full mb-2 px-4 py-3 border rounded-xl

        'border-gray-200': !errors.phone,
        'border-red-500 ring-red-500': errors.phone

      placeholder="+63 XXX XXX XXXX" />
    <div *ngIf="errors.phone" 
         class="text-red-400 text-xs">
      {{ errors.phone }}
    </div>
  </div>
</div>

<div class="grid grid-cols-2 gap-4 mb-6">
  <div>
    <label class="text-sm text-gray-400 mb-2">Password</label>
    <div class="relative">
      <input [type]="showPassword ? 'text' : 'password'" [ngModel]="formData.password" (ngModelChange)="onFieldChange('password', $event)"
        class="w-full mb-2 px-4 py-3 pr-12 border rounded-xl 
               focus:ring-2 outline-none 
               bg-white text-gray-900 placeholder-gray-400"
        [ngClass]="{
          'border-gray-200': !errors.password,
          'border-red-500 ring-red-500': errors.password
        }"
        placeholder="Min. 6 characters" />
      <button type="button" (click)="onTogglePasswordVisibility()" 
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
        <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        </svg>
        <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
        </svg>
      </button>
    </div>
    <div *ngIf="errors.password" 
         class="text-red-400 text-xs">
      {{ errors.password }}
    </div>
  </div>

  <div>
    <label class="text-sm text-gray-400 mb-2">Confirm Password</label>
    <div class="relative">
      <input [type]="showConfirmPassword ? 'text' : 'password'" [ngModel]="formData.confirmPassword" (ngModelChange)="onFieldChange('confirmPassword', $event)"
        class="w-full mb-2 px-4 py-3 pr-12 border rounded-xl 
               focus:ring-2 outline-none 
               bg-white text-gray-900 placeholder-gray-400"
        [ngClass]="{
          'border-gray-200': !errors.confirmPassword,
          'border-red-500 ring-red-500': errors.confirmPassword
        }"
        placeholder="Confirm password" />
      <button type="button" (click)="onToggleConfirmPasswordVisibility()" 
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
        <svg *ngIf="!showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        </svg>
        <svg *ngIf="showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
        </svg>
      </button>
    </div>
    <div *ngIf="errors.confirmPassword" 
         class="text-red-400 text-xs">
      {{ errors.confirmPassword }}
    </div>
  </div>
</div>

<!-- Terms and Conditions -->
<div class="flex items-center mb-6 text-gray-400">
  <input type="checkbox" class="mr-2 accent-[#2563EB]" id="terms">
  <label for="terms" class="text-sm">
    I agree to the <a href="#" class="text-[#2563EB] hover:underline">Terms and Conditions</a> and <a href="#" class="text-[#2563EB] hover:underline">Privacy Policy</a>
  </label>
</div>

<button (click)="onRegister()" 
        [disabled]="isRegistering"
        class="w-full bg-[#2563EB] text-white py-3 rounded-xl 
               hover:bg-[#1D4ED8] transition duration-300 shadow-lg mb-4
               disabled:opacity-50 disabled:cursor-not-allowed">
  <span *ngIf="!isRegistering">Create Account</span>
  <span *ngIf="isRegistering" class="flex items-center justify-center">
    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    Creating Account...
  </span>
</button>

<p class="text-sm text-center text-gray-400">
  Already have an account?
  <button (click)="onShowLogin()"
    class="text-[#2563EB] font-semibold hover:underline">
    Back to Login
  </button>
</p>
