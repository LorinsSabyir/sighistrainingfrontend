<form class="login-card" [formGroup]="loginForm" (ngSubmit)="login()">
  <div>
    <p class="form-kicker">Staff portal</p>
    <h2>Sign in</h2>
  </div>

  <label class="field">
    <span>Email</span>
    <input
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="name@hospital.com"
      aria-describedby="login-message"
    />
  </label>

  <label class="field">
    <span>Password</span>
    <input
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="Enter your password"
      aria-describedby="login-message"
    />
  </label>

  @if (errorMessage()) {
    <p id="login-message" class="message error" role="alert">{{ errorMessage() }}</p>
  }

  @if (successMessage()) {
    <p id="login-message" class="message success" role="status">{{ successMessage() }}</p>
  }

  <button type="submit" [disabled]="isSubmitting()">
    {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
  </button>
</form>
