<!-- General Error Message -->
<div *ngIf="loginError" 
     class="w-full mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-300 text-sm">
  {{ loginError }}
</div>

<label class="text-sm text-gray-400 mb-2">Username</label>
<input type="text" [ngModel]="username" (ngModelChange)="onUsernameChange($event)"
  class="w-full mb-2 px-4 py-3 border rounded-xl 
         focus:ring-2 outline-none 
         bg-white text-gray-900 placeholder-gray-400"
  [ngClass]="{
    'border-gray-200': !usernameError,
    'border-red-500 ring-red-500': usernameError
  }"
  placeholder="emilys" />

<!-- Username Error -->
<div *ngIf="usernameError" 
     class="mb-6 text-red-400 text-xs">
  {{ usernameError }}
</div>

<label class="text-sm text-gray-400 mb-2">Password</label>
<div class="relative">
  <input [type]="showPassword ? 'text' : 'password'" [ngModel]="password" (ngModelChange)="onPasswordChange($event)"
    class="w-full mb-2 px-4 py-3 pr-12 border rounded-xl 
           focus:ring-2 outline-none 
           bg-white text-gray-900 placeholder-gray-400"
    [ngClass]="{
      'border-gray-200': !passwordError,
      'border-red-500 ring-red-500': passwordError
    }"
    placeholder="emilyspass" />
  <button type="button" (click)="onTogglePasswordVisibility()" 
          class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
    <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
    </svg>
    <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
    </svg>
  </button>
</div>

<!-- Password Error -->
<div *ngIf="passwordError" 
     class="mb-6 text-red-400 text-xs">
  {{ passwordError }}
</div>

<div class="flex items-center mb-6 text-gray-400">
  <input type="checkbox" class="mr-2 accent-[#2563EB]"
    [ngModel]="rememberMe"
    (ngModelChange)="rememberMeChange.emit($event)">
  <span class="text-sm">Remember me</span>
</div>

<button (click)="onLogin()" 
  [disabled]="isLoading"
  class="w-full bg-[#2563EB] text-white py-3 rounded-xl 
         hover:bg-[#1D4ED8] transition duration-300 shadow-lg mb-4
         disabled:opacity-50 disabled:cursor-not-allowed">
  <span *ngIf="!isLoading">Log in</span>
  <span *ngIf="isLoading" class="flex items-center justify-center">
    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    Signing in...
  </span>
</button>

<p class="text-sm text-center text-gray-400">
  Don't have an account?
  <button (click)="onShowRegister()"
    class="text-[#2563EB] font-semibold hover:underline">
    Create Account
  </button>
</p>
